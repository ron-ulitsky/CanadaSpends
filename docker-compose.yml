# Docker Compose configuration for local development
# Usage: docker compose up

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: canadaspends-dev
    ports:
      - "3000:3000"
    volumes:
      # Mount source code for hot reload
      - ./src:/app/src
      - ./public:/app/public
      - ./data:/app/data
      - ./articles:/app/articles
      # Mount configuration files
      - ./next.config.ts:/app/next.config.ts
      - ./tailwind.config.ts:/app/tailwind.config.ts
      - ./lingui.config.js:/app/lingui.config.js
      - ./mdx-components.tsx:/app/mdx-components.tsx
      - ./components.json:/app/components.json
      - ./tsconfig.json:/app/tsconfig.json
      - ./postcss.config.mjs:/app/postcss.config.mjs
      # Persist node_modules as anonymous volume to avoid overwriting
      - /app/node_modules
      # Persist .next build cache
      - /app/.next
    env_file:
      - path: .env.local
        required: false
    environment:
      - NODE_ENV=development
      - NEXT_TELEMETRY_DISABLED=1
      # Enable polling for file changes (useful for some host OS configurations)
      - WATCHPACK_POLLING=true
    # Ensure proper signal handling for graceful shutdown
    stdin_open: true
    tty: true